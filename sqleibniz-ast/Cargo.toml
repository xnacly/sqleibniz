[package]
name = "sqleibniz-ast"
version = "0.0.2"
edition = "2024"
description = "SQLite lexer, parser, and abstract syntax tree for sqleibniz"
repository = "https://github.com/xnacly/sqleibniz"
license = "MIT"
readme = "README.md"

[features]
trace = ["sqleibniz-proc"]
serde = ["dep:serde"]

[dependencies]
sqleibniz-proc = { version = "0.0.1", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
