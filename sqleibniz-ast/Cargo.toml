[package]
name = "sqleibniz-ast"
version = "0.0.1"
edition = "2024"
description = "SQLite lexer, parser, and abstract syntax tree for sqleibniz"
repository = "https://github.com/xnacly/sqleibniz"
license = "MIT"
readme = "README.md"

[features]
trace = ["sqleibniz-proc"]

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqleibniz-proc = { version = "0.0.1", optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
